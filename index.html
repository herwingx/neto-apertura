<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Apertura Neto · Checklist de Soporte Técnico</title>
<style>
:root {
  --bg: #0b1120;
  --card: #151f32;
  --card-sub: #1e293b;
  --line: #2d3b53;
  --tx: #f1f5f9;
  --tx-muted: #94a3b8;
  --neto-red: #e11d48;
  --neto-yellow: #facc15;
  --ok: #22c55e;
  --ok-bg: #14532d;
  --bad: #ef4444;
  --bad-bg: #7f1d1d;
  --warn: #f59e0b;
  --warn-bg: #78350f;
  --na-bg: #475569;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  padding-bottom: 95px;
}
/* Header */
header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(11, 17, 32, 0.95);
  backdrop-filter: blur(10px);
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--line);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.logo-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 15px;
  color: var(--tx);
}
.badge-neto {
  background: linear-gradient(135deg, #e11d48, #be123c);
  color: #fff;
  padding: 2px 7px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.5px;
}
.store-tag {
  color: var(--neto-yellow);
  font-weight: 600;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.sync-btn {
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--tx);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  font-weight: 600;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--warn);
}
.dot.ok { background: var(--ok); }
.dot.saving { background: var(--neto-yellow); animation: pulse 1s infinite; }
@keyframes pulse { 0%{opacity:.4} 50%{opacity:1} 100%{opacity:.4} }

/* Progress bar */
.progress-wrap {
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.bar {
  flex: 1;
  height: 6px;
  background: var(--card-sub);
  border-radius: 10px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #e11d48, #22c55e);
  width: 0%;
  transition: width 0.3s ease;
}
.progress-pct {
  font-size: 11px;
  font-weight: 700;
  color: var(--tx-muted);
  min-width: 38px;
  text-align: right;
}

/* Layout */
main {
  max-width: 680px;
  margin: 0 auto;
  padding: 10px 12px;
}
.section-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  margin: 10px 0;
  overflow: hidden;
}
details summary {
  list-style: none;
  cursor: pointer;
  padding: 13px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  font-size: 14px;
  user-select: none;
}
details summary::-webkit-details-marker { display: none; }
details summary::after {
  content: "▾";
  font-size: 14px;
  color: var(--tx-muted);
  transition: transform 0.2s;
}
details[open] summary::after {
  transform: rotate(180deg);
}
.count-badge {
  font-size: 12px;
  font-weight: 600;
  color: var(--tx-muted);
  background: var(--card-sub);
  padding: 2px 8px;
  border-radius: 12px;
  margin-right: 6px;
  margin-left: auto;
}
.count-badge.done {
  color: #fff;
  background: var(--ok-bg);
}
.section-body {
  padding: 0 10px 12px;
}

/* Checklist items */
.chk-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 11px 8px;
  border-top: 1px solid var(--line);
  cursor: pointer;
  user-select: none;
}
.chk-item input { display: none; }
.custom-box {
  width: 24px;
  height: 24px;
  min-width: 24px;
  border: 2px solid var(--line);
  background: var(--bg);
  border-radius: 7px;
  display: grid;
  place-items: center;
  margin-top: 1px;
  transition: all 0.15s ease;
}
.chk-item input:checked + .custom-box {
  background: var(--ok);
  border-color: var(--ok);
}
.chk-item input:checked + .custom-box::after {
  content: "✓";
  color: #052e16;
  font-weight: 900;
  font-size: 15px;
}
.item-text {
  flex: 1;
  font-size: 14px;
  line-height: 1.35;
  color: var(--tx);
  transition: color 0.15s;
}
.chk-item input:checked ~ .item-text {
  color: var(--tx-muted);
  text-decoration: line-through;
}

/* Warnings / Info callout */
.alert-box {
  background: #422006;
  border: 1px solid #78350f;
  color: #fef08a;
  padding: 10px 12px;
  border-radius: 10px;
  margin: 6px 6px 10px;
  font-size: 13px;
  line-height: 1.35;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Inputs & Form */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 4px 6px 8px;
}
.col-full { grid-column: 1 / -1; }
label.field-lbl {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 11px;
  font-weight: 600;
  color: var(--tx-muted);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
input.txt-input, select.txt-input, textarea.txt-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--tx);
  border-radius: 9px;
  padding: 10px 11px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
input.txt-input:focus, textarea.txt-input:focus {
  border-color: var(--neto-red);
}
textarea.txt-input {
  min-height: 70px;
  resize: vertical;
}

/* Peripherals Table */
table.periph-tbl {
  width: 100%;
  border-collapse: separate;
  border-spacing: 4px;
  font-size: 13px;
  margin-top: 4px;
}
table.periph-tbl th {
  padding: 6px 4px;
  color: var(--tx-muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}
table.periph-tbl td {
  padding: 3px 2px;
}
table.periph-tbl td.p-name {
  color: var(--tx);
  font-weight: 500;
  font-size: 13px;
  padding-left: 6px;
}
.pill-btn {
  width: 100%;
  min-height: 38px;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s, transform 0.1s;
}
.pill-btn:active { transform: scale(0.97); }
.pill-Ok { background: var(--ok-bg); color: #86efac; border: 1px solid #16a34a; }
.pill-Falla { background: var(--bad-bg); color: #fca5a5; border: 1px solid #dc2626; }
.pill-Sin { background: var(--warn-bg); color: #fde047; border: 1px solid #d97706; }
.pill-NA { background: var(--na-bg); color: #cbd5e1; border: 1px solid #64748b; }

/* Quick chips list */
.add-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  padding: 0 4px;
}
.btn-mini-add {
  background: var(--card-sub);
  border: 1px solid var(--line);
  color: var(--tx);
  border-radius: 9px;
  padding: 0 14px;
  font-weight: 700;
  cursor: pointer;
}

/* Report View */
.fmt-tabs {
  display: flex;
  gap: 6px;
  padding: 0 4px 10px;
}
.tab-btn {
  flex: 1;
  padding: 9px 4px;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--tx-muted);
  font-size: 12px;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
}
.tab-btn.active {
  background: var(--neto-red);
  color: #fff;
  border-color: var(--neto-red);
}
pre.report-box {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  margin: 0 4px 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 13px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 400px;
  overflow-y: auto;
  color: #e2e8f0;
}
.btn-row {
  display: flex;
  gap: 8px;
  padding: 0 4px;
}
.btn-act {
  flex: 1;
  padding: 13px 10px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity 0.2s;
}
.btn-act:active { opacity: 0.8; }
.btn-wa { background: #25d366; color: #042f13; }
.btn-copy { background: #3b82f6; color: #eff6ff; }
.btn-reset { background: var(--line); color: var(--tx); }

/* Floating bottom bar */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  display: flex;
  gap: 8px;
  max-width: 680px;
  margin: 0 auto;
}
.btn-main {
  flex: 2;
  background: linear-gradient(135deg, #e11d48, #be123c);
  color: #fff;
  border: none;
  border-radius: 11px;
  padding: 12px 14px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.btn-sec {
  flex: 1;
  background: var(--card-sub);
  color: var(--tx);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 12px 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

/* Modals */
dialog {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  color: var(--tx);
  padding: 0;
  max-width: 500px;
  width: 92vw;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}
dialog::backdrop {
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
}
.modal-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-weight: 700; font-size: 16px; margin: 0; }
.modal-body { padding: 14px 16px; }
.modal-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.close-btn {
  background: none;
  border: none;
  color: var(--tx-muted);
  font-size: 20px;
  cursor: pointer;
}
/* Toast Notification */
#toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: #1e293b;
  color: #fff;
  border: 1px solid var(--ok);
  padding: 10px 18px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
  z-index: 100;
}
#toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo-title">
      <span class="badge-neto">NETO</span>
      <span>Apertura</span>
      <span id="storeHeaderTag" class="store-tag"></span>
    </div>
    <div class="header-actions">
      <button id="syncModalBtn" class="sync-btn" title="Configurar Nube y Compartir">
        <span id="syncDot" class="dot"></span>
        <span id="syncStatusText">Nube</span>
      </button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="bar"><div id="progressBar" class="bar-fill"></div></div>
    <div id="progressPct" class="progress-pct">0%</div>
  </div>
</header>

<main id="appContent"></main>

<div class="bottom-bar">
  <button id="quickShareBtn" class="btn-sec" title="Compartir con compañero">🔗 Compartir</button>
  <button id="navReportBtn" class="btn-main">Generar Reporte WhatsApp</button>
</div>

<div id="toast"></div>

<!-- Dialog Supabase & Sync -->
<dialog id="syncDialog">
  <div class="modal-header">
    <h3 class="modal-title">☁️ Sincronización en la Nube</h3>
    <button class="close-btn" onclick="$('#syncDialog').close()">✕</button>
  </div>
  <div class="modal-body">
    <p style="font-size:13px; color:var(--tx-muted); margin-top:0;">
      Tu avance se guarda <b>automáticamente</b> en este teléfono y en Supabase. Si van dos compañeros, comparte este código para ver el checklist actualizado al mismo tiempo.
    </p>
    <label class="field-lbl">Código de Sesión / Tienda
      <input class="txt-input" id="cfgCode" placeholder="Ej. NETO-1712-APERTURA">
    </label>
    <div style="margin-top:10px; display:flex; gap:8px;">
      <button id="btnGenCode" class="btn-sec" style="flex:1;">🎲 Generar Código</button>
      <button id="btnCopyLink" class="btn-sec" style="flex:1;">🔗 Copiar Enlace</button>
    </div>

    <details style="margin-top:14px;">
      <summary style="font-size:12px; color:var(--tx-muted); cursor:pointer;">Configuración avanzada de Supabase</summary>
      <div style="margin-top:8px;">
        <label class="field-lbl">Supabase Project URL
          <input class="txt-input" id="cfgUrl">
        </label>
        <label class="field-lbl" style="margin-top:6px;">Supabase Anon Key
          <input class="txt-input" id="cfgKey">
        </label>
      </div>
    </details>
  </div>
  <div class="modal-footer">
    <button id="btnPullCloud" class="btn-sec" style="color:var(--tx);">⬇ Cargar Avance</button>
    <button id="btnSaveConfig" class="btn-main" style="flex:none; padding:10px 18px;">Aceptar</button>
  </div>
</dialog>

  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");

let syncTimer = null;

function setSyncUI(status, label) {
  const dot = $("#syncDot");
  const txt = $("#syncStatusText");
  if (!dot || !txt) return;
  dot.className = "dot " + status;
  txt.textContent = label;
}

async function rpcCall(fn, body) {
  const r = await fetch(CFG.url.replace(/\/$/, "") + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: {
      "apikey": CFG.key,
      "Authorization": "Bearer " + CFG.key,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function pushToCloud() {
  if (!CFG.url || !CFG.key || !CFG.code || CFG.code.length < 10) {
    setSyncUI("", "Local");
    return;
  }
  setSyncUI("saving", "Guardando...");
  try {
    await rpcCall("neto_save_checklist", { p_code: CFG.code, p_data: STATE });
    setSyncUI("ok", "Nube");
  } catch (err) {
    console.warn("Error sincronizando:", err);
    setSyncUI("", "Local");
  }
}

async function pullFromCloud(silent = false) {
  if (!CFG.url || !CFG.key || !CFG.code) return;
  try {
    setSyncUI("saving", "Sincronizando...");
    const res = await rpcCall("neto_get_checklist", { p_code: CFG.code });
    if (res && res.data && Object.keys(res.data).length > 0) {
      STATE = Object.assign(createFreshState(), res.data);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      renderApp();
      setSyncUI("ok", "Nube");
      if (!silent) showToast("✓ Avance cargado desde la nube");
    } else {
      setSyncUI("ok", "Nube");
      if (!silent) showToast("Sesión iniciada (sin datos previos)");
      pushToCloud();
    }
  } catch (err) {
    setSyncUI("", "Local");
    if (!silent) showToast("⚠️ Sin conexión: trabajando en modo local");
  }
}

function scheduleSave() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
  updateProgressBar();
  updateLiveStoreTag();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToCloud, 1200);
}

function formatDate(d) {
  if (!d) return "";
  const parts = d.split("-");
  return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : d;
}

function generateReportText() {
  const f = STATE.f;
  const lines = [];

  const getActive = (key) => STATE[key].filter(x => x.on).map(x => x.t);
  const corr = getActive("corr");
  const pend = getActive("pend");
  const hall = getActive("hall");

  // Done checklist deliverables
  const doneWorks = [...new Set(
    PHASES.flatMap(p => p.items)
      .filter(i => STATE.checks[i.id] && i.rep)
      .map(i => i.rep)
  )];

  // Peripherals in failure
  const fails = [];
  STATIONS.forEach(s => {
    PERIPHERALS.forEach(p => {
      if (STATE.periph[s.id + "|" + p] === "Falla") {
        fails.push(`${p.replace(/^..\s*/, "")} en ${s.id}: Falla`);
      }
    });
  });

  const header = [
    `📆 Fecha: ${formatDate(f.fecha) || "Sin fecha"}`,
    "",
    "Se concluye visita a Tienda Neto 🏪",
    `🛒 ${f.tienda || "Tienda de Apertura"}`,
    (f.sian || f.region) ? `🗺️ Zona SIAN: ${f.sian || "—"}${f.region ? " · Región: " + f.region : ""}` : null
  ].filter(Boolean);

  const netInfo = [
    f.isp ? `📡 Proveedor Internet: ${f.isp}${f.svc ? " (" + f.svc + ")" : ""}` : null,
    f.speed ? `🚀 SpeedTest: ${f.speed} Mbps` : null
  ].filter(Boolean);

  const versions = [
    f.imagen ? `Imagen SO: ${f.imagen}` : null,
    f.hydra ? `Hydra: ${f.hydra}` : null,
    f.fortinet ? `Fortinet: ${f.fortinet}` : null
  ].filter(Boolean).join(" · ");

  const responsibles = [
    `🧑🏻‍💻 Atiende Visita: Ing. ${f.ing || "Soporte Técnico"}`,
    `🤝 Se entrega a Calidad Operativa: ${f.co || "Pendiente de validación"}`
  ];

  const hashtags = [
    "",
    "#ConTODO 👊🏼",
    "#CreandoValorNETO 🏆",
    "#SistemasInfraestructura 🇲🇽🛒"
  ];

  // Helper for bullet list
  const addBlock = (title, items, icon) => {
    if (!items || items.length === 0) return [];
    return ["", title, ...items.map(it => `${icon} ${it}`)];
  };

  /* ---- FORMATO 1: RESUMEN HÍBRIDO PRO (RECOMENDADO) ---- */
  if (STATE.fmt === "pro") {
    lines.push(...header, "");
    if (versions) lines.push(`⚙️ ${versions}`);
    if (netInfo.length) lines.push(...netInfo);

    // Peripheral matrix summary
    lines.push("", "*ESTADO DE EQUIPOS*");
    PERIPHERALS.forEach(p => {
      const summary = STATIONS.map(s => `${s.id}: ${STATE_LABELS[STATE.periph[s.id + "|" + p]]}`).join(" | ");
      lines.push(`${p}: ${summary}`);
    });
    lines.push(`🎞️ Rack de comunicaciones: ${f.rack || "Ok"}${STATE.vpn ? " · 🆙 Balanceo VPN: Ok" : ""}`);
    lines.push("*(C02 por diseño arquitectónico no lleva No-Break)*");

    const deliverables = [...doneWorks.slice(0, 7), ...corr];
    lines.push(...addBlock("*TRABAJOS REALIZADOS*", deliverables, "✅"));
    lines.push(...addBlock("*PENDIENTES*", pend, "❌"));
    lines.push(...addBlock("*HALLAZGOS*", hall, "⚠️"));

    if (fails.length) {
      lines.push(...addBlock("*EQUIPOS CON FALLA*", fails, "❌"));
    }

    if (STATE.obs.trim()) {
      lines.push("", "*OBSERVACIONES*", STATE.obs.trim());
    }

    lines.push("", ...responsibles);
    lines.push(...hashtags);

  /* ---- FORMATO 2: EJECUTIVO CORTO ---- */
  } else if (STATE.fmt === "corto") {
    lines.push(...header, "");
    if (versions) lines.push(versions);
    if (netInfo.length) lines.push(...netInfo);
    lines.push(...responsibles);

    lines.push(...addBlock("*Entregables*", corr, "✅"));
    lines.push(...addBlock("*Pendientes*", pend, "❌"));
    lines.push(...addBlock("*Hallazgos*", hall, "⚠️"));

    if (fails.length) {
      lines.push(...addBlock("*Fallas*", fails, "❌"));
    }

    lines.push(...hashtags);

  /* ---- FORMATO 3: SIAN COMPLETO (TRADICIONAL) ---- */
  } else {
    lines.push(...header, "", "🪛🖥️");
    doneWorks.forEach(w => lines.push(`⚙️ ${w}`));

    lines.push(
      "",
      "🔰 *Equipos de comunicaciones*",
      "Switch: Ok",
      `Marca: Fortinet · Modelo: ${f.fortinet || "40F"}`,
      "Estatus: Ok",
      "",
      ...netInfo,
      "",
      "*OBSERVACIONES*"
    );

    PERIPHERALS.forEach(p => {
      const pClean = p.replace(/^..\s*/, "").toUpperCase();
      lines.push(pClean + ".");
      STATIONS.forEach(s => {
        lines.push(`${s.id}: ${STATE_LABELS[STATE.periph[s.id + "|" + p]]}`);
      });
    });

    lines.push(
      `🎞️ RACK DE COMUNICACIONES: ${f.rack || "Ok"}`,
      `📨 Cambios HYDRA: ${f.hydra || "Ok"}`,
      `🆙 Balanceo VPN: ${STATE.vpn ? "Ok" : "N/A"}`
    );

    lines.push(...addBlock("*CORRECCIONES*", corr, "✅"));
    lines.push(...addBlock("*PENDIENTES*", pend, "❌"));
    lines.push(...addBlock("*HALLAZGOS*", hall, "❌"));

    if (STATE.obs.trim()) {
      lines.push("", STATE.obs.trim());
    }

    lines.push(
      "",
      "📸 Inventario Fotográfico: COMPLETO",
      "",
      ...responsibles,
      ...hashtags
    );
  }

  return lines.join("\n");
}

function updateReportOutput() {
  const box = $("#reportOutput");
  if (box) box.textContent = generateReportText();
}

/* ============================================================
   6. CONTROLADORES DE EVENTOS
============================================================ */
const app = $("#appContent");

// Form inputs
app.addEventListener("input", (e) => {
  const d = e.target.dataset;
  if (d.f) {
    STATE.f[d.f] = e.target.value;
    updateLiveStoreTag();
    scheduleSave();
    updateReportOutput();
  } else if (d.obs !== undefined) {
    STATE.obs = e.target.value;
    scheduleSave();
    updateReportOutput();
  }
});

// Checkboxes
app.addEventListener("change", (e) => {
  const d = e.target.dataset;
  if (d.chk) {
    STATE.checks[d.chk] = e.target.checked;
    scheduleSave();
    renderApp();
  } else if (d.list) {
    const [key, idx] = d.list.split("|");
    STATE[key][parseInt(idx)].on = e.target.checked;
    scheduleSave();
    renderApp();
  }
});

// Buttons and pills clicks
app.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const d = btn.dataset;

  // Toggle peripheral pill
  if (d.pp) {
    const cur = STATE.periph[d.pp] || "Ok";
    const next = STATES[(STATES.indexOf(cur) + 1) % STATES.length];
    STATE.periph[d.pp] = next;
    scheduleSave();
    renderApp();
    return;
  }

  // VPN toggle
  if (d.vpn !== undefined) {
    STATE.vpn = !STATE.vpn;
    scheduleSave();
    renderApp();
    return;
  }

  // Report format tab
  if (d.fmt) {
    STATE.fmt = d.fmt;
    scheduleSave();
    renderApp();
    return;
  }

  // Add custom deliverable / pending / finding
  if (d.addBtn) {
    const input = app.querySelector(`[data-add-input="${d.addBtn}"]`);
    if (input && input.value.trim()) {
      STATE[d.addBtn].push({ t: input.value.trim(), on: true });
      input.value = "";
      scheduleSave();
      renderApp();
    }
    return;
  }

  // Copy report
  if (btn.id === "btnCopyReport") {
    const text = generateReportText();
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = "✓ ¡Copiado!";
      showToast("✓ Reporte copiado al portapapeles");
      setTimeout(() => { btn.textContent = "📋 Copiar Reporte"; }, 2000);
    }).catch(() => {
      showToast("Selecciona el texto para copiar");
    });
    return;
  }

  // Send to WhatsApp
  if (btn.id === "btnSendWa") {
    const text = generateReportText();
    const url = "https://wa.me/?text=" + encodeURIComponent(text);
    window.open(url, "_blank");
    return;
  }

  // Reset form
  if (btn.id === "btnResetApp") {
    if (confirm("¿Deseas iniciar una nueva apertura? Se limpiarán las casillas de este dispositivo (se conserva tu nombre de ingeniero).")) {
      const ing = STATE.f.ing;
      STATE = createFreshState();
      STATE.f.ing = ing;
      scheduleSave();
      renderApp();
      showToast("Formulario reiniciado para nueva apertura");
    }
    return;
  }
});

// Keep track of collapsed/expanded details
app.addEventListener("toggle", (e) => {
  const p = e.target.dataset && e.target.dataset.p;
  if (p) {
    STATE.open[p] = e.target.open;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
  }
}, true);

// Header & bottom bar navigation
$("#navReportBtn").onclick = () => {
  STATE.open.rep = true;
  renderApp();
  const repSec = $("#reportSection");
  if (repSec) repSec.scrollIntoView({ behavior: "smooth" });
};

// Sync Modal
$("#syncModalBtn").onclick = () => {
  $("#cfgCode").value = CFG.code || "";
  $("#cfgUrl").value = CFG.url || "";
  $("#cfgKey").value = CFG.key || "";
  $("#syncDialog").showModal();
};

$("#btnGenCode").onclick = () => {
  const storeNum = STATE.f.tienda.match(/\d+/);
  const prefix = storeNum ? `NETO-${storeNum[0]}-` : "NETO-";
  $("#cfgCode").value = prefix + Math.random().toString(36).substring(2, 8).toUpperCase() + "-APERTURA";
};

$("#btnCopyLink").onclick = () => {
  const code = $("#cfgCode").value.trim() || CFG.code;
  const shareUrl = window.location.origin + window.location.pathname + "?code=" + encodeURIComponent(code);
  navigator.clipboard.writeText(shareUrl).then(() => {
    showToast("✓ Enlace de sesión copiado al portapapeles");
  });
};

$("#quickShareBtn").onclick = () => {
  const shareUrl = window.location.origin + window.location.pathname + "?code=" + encodeURIComponent(CFG.code);
  const storeName = STATE.f.tienda || "Apertura Neto";
  const msg = `Checklist en tiempo real para ${storeName}:\n${shareUrl}`;

  if (navigator.share) {
    navigator.share({ title: "Checklist Neto", text: msg, url: shareUrl }).catch(() => {});
  } else {
    navigator.clipboard.writeText(shareUrl).then(() => {
      showToast("✓ Enlace para tu compañero copiado");
    });
  }
};

$("#btnSaveConfig").onclick = () => {
  CFG.code = $("#cfgCode").value.trim();
  CFG.url = $("#cfgUrl").value.trim() || DEFAULT_URL;
  CFG.key = $("#cfgKey").value.trim() || DEFAULT_KEY;
  localStorage.setItem("neto_cfg", JSON.stringify(CFG));
  $("#syncDialog").close();
  pushToCloud();
  showToast("Configuración guardada");
};

$("#btnPullCloud").onclick = () => {
  CFG.code = $("#cfgCode").value.trim();
  CFG.url = $("#cfgUrl").value.trim() || DEFAULT_URL;
  CFG.key = $("#cfgKey").value.trim() || DEFAULT_KEY;
  localStorage.setItem("neto_cfg", JSON.stringify(CFG));
  pullFromCloud();
  $("#syncDialog").close();
};

/* ============================================================
   7. INICIALIZACIÓN Y SERVICE WORKER
============================================================ */
renderApp();

// If opened with a specific session code in URL, load it immediately
const initialUrlParams = new URLSearchParams(window.location.search);
if (initialUrlParams.get("code") || initialUrlParams.get("session")) {
  pullFromCloud(true);
} else {
  // Silent sync to ensure cloud backup exists
  pushToCloud();
}

// Register service worker for offline use
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(console.warn);
  });
}
</script>
</body>
</html>
